<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WM-TOOL</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    font-family: "JetBrains Mono", "Consolas", monospace;
    background-color: #0f1117;
    color: #e6edf3;
    padding: 80px 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景几何装饰，极少量，弱透明度，不抢视觉 */
  .geo {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: 0.08;
  }
  .circle-1 {
    width: 320px;
    height: 320px;
    border: 1px solid #58a6ff;
    border-radius: 50%;
    top: -120px;
    right: -100px;
  }
  .square-1 {
    width: 160px;
    height: 160px;
    border: 1px solid #f778ba;
    bottom: -60px;
    left: -70px;
    transform: rotate(25deg);
  }
  .line-1 {
    width: 220px;
    height: 1px;
    background: #3fb950;
    top: 24%;
    left: 10%;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  header {
    margin-bottom: 64px;
  }

  h1 {
    font-size: 42px;
    letter-spacing: 2px;
    color: #f0f6fc;
    margin-bottom: 12px;
  }
  .subtitle {
    color: #8b949e;
    font-size: 16px;
  }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .tool-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    transition: 0.2s ease;
  }

  .tool-card:hover {
    border-color: #58a6ff;
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .tool-card.music:hover {
    border-color: #f778ba;
  }

  .tool-card h2 {
    font-size: 22px;
    margin-bottom: 10px;
  }
  .tool-card p {
    color: #8b949e;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .tool-card .link-text {
    font-size: 14px;
    color: #58a6ff;
  }
  .tool-card.music .link-text {
    color: #f778ba;
  }

  footer {
    margin-top: 70px;
    text-align: center;
    color: #6e7681;
    font-size:13px;
  }

  @media (max-width: 640px) {
    .tool-grid {
      grid-template-columns: 1fr;
    }
    h1 {
      font-size:32px;
    }
  }
</style>
</head>
<body>
  <!-- 背景几何装饰 -->
  <div class="geo circle-1"></div>
  <div class="geo square-1"></div>
  <div class="geo line-1"></div>

  <div class="container">
    <header>
      <h1>WM‑TOOL</h1>
      <p class="subtitle">Personal dev tool collection | 个人开发工具合集</p>
    </header>

    <div class="tool-grid">
      <!-- Music Tool -->
      <a class="tool-card music" href="https://watormelon.github.io/midi_learning/" target="_blank">
        <h2>Music Tool</h2>
        <p>MIDI乐理学习键盘，虚拟钢琴、和弦查询，用于电子音乐与Launchpad练习。</p>
        <div class="link-text">Open →</div>
      </a>

      <!-- Ride Speed -->
      <a class="tool-card" href="https://watormelon.github.io/speed" target="_blank">
        <h2>Ride Speed</h2>
        <p>骑行码表工具，GPS实时测速、最高速度记录、深色主题切换。</p>
        <div class="link-text">Open →</div>
      </a>
    </div>

    <footer>
      WM Personal Tools • Built with HTML & JS
    </footer>
  </div>
</body>
</html>
